apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "resources-presenter.fullname" . }}-resources
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "resources-presenter.labels" . | nindent 4 }}
rules:
  #- apiGroups: [""]
  #  resources: ["events"]
  #  verbs: ["get", "list", "watch"]
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get"]