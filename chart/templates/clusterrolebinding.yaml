{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "resources-presenter.fullname" . }}
  labels:
    {{- include "resources-presenter.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "resources-presenter.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "resources-presenter.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
