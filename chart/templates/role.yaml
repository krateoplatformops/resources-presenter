apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "resources-proxy.fullname" . }}-resources
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "resources-proxy.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get"]