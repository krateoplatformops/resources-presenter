{{- /*
Validation block
*/ -}}

{{- $config := .Values.config | default dict }}

{{- $dbSecret := .Values.dbSecret | default dict }}
{{- $dbSecretName := $dbSecret.name | default "" }}

{{- $signKeySecret := .Values.signKeySecret | default dict }}
{{- $signKeySecretName := $signKeySecret.name | default "" }}

{{- if and (not (hasKey $config "DB_USER")) (eq $dbSecretName "") }}
{{- fail "DB_USER must be set either in config or via dbSecret.name" }}
{{- end }}

{{- if and (not (hasKey $config "DB_PASS")) (eq $dbSecretName "") }}
{{- fail "DB_PASS must be set either in config or via dbSecret.name" }}
{{- end }}

{{- if and (not (hasKey $config "SIGN_KEY")) (eq $signKeySecretName "") }}
{{- fail "SIGN_KEY must be set either in config or via signKeySecret.name" }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "resources-presenter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "resources-presenter.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "resources-presenter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "resources-presenter.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "resources-presenter.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
          {{- range $k, $v := $config }}
          - name: {{ $k }}
            value: {{ $v | quote }}
          {{- end }}

          {{- if and (not (hasKey $config "DB_USER")) (ne $dbSecretName "") }}
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: {{ $dbSecretName }}
                key: DB_USER
          {{- end }}

          {{- if and (not (hasKey $config "DB_PASS")) (ne $dbSecretName "") }}
          - name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: {{ $dbSecretName }}
                key: DB_PASS
          {{- end }}

          {{- if and (not (hasKey $config "SIGN_KEY")) (ne $signKeySecretName "") }}
          - name: SIGN_KEY
            valueFrom:
              secretKeyRef:
                name: {{ $signKeySecretName }}
                key: SIGN_KEY
          {{- end }}

          ports:
            - name: http
              containerPort: {{ $config.PORT | default "8080" | int }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}