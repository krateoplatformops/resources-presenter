# Default values for resources-presenter.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/krateoplatformops/resources-presenter
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 45
  periodSeconds: 90

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 45
  periodSeconds: 90

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# ============================================================================
# Application-Specific Configuration
# ============================================================================

# Secret reference for DB credentials
# IMPORTANT: You must create this secret before deploying the chart.
# The secret must contain: DB_USER and DB_PASS keys
# The secret must be created in the same namespace where the chart is deployed.
# Example:
#   kubectl create secret generic events-stack-db \
#     --from-literal=DB_USER=myuser \
#     --from-literal=DB_PASS=mypass \
#     -n namespace_name
# NOTE: if the krateo installation is executed with krateoctl, the dbSecret will be automatically created with the appropriate values.
dbSecret:
  name: events-stack-db # Name of the Kubernetes Secret containing DB_USER and DB_PASS keys for database credentials

# Secret reference for JWT signing key
# NOTE: if the krateo installation is executed with krateoctl, the signKeySecret will be automatically created with the appropriate values.
signKeySecret:
  name: jwt-sign-key # Name of the Kubernetes Secret containing SIGN_KEY for JWT validation

endpointSecret:
  create: true # Specifies whether a Secret containing the service URL should be created.

# Application configuration environment variables
config:
  # HTTP server port (default: 8080)
  # NOTE: containerPort will match this value automatically
  # PORT: "8080"

  # Enable or disable debug logging
  DEBUG: "false"

  # Maximum time to wait for PostgreSQL to become ready
  DB_READY_TIMEOUT: "5m"

  # Extra query parameters (e.g. sslmode=disable&connect_timeout=5)
  DB_PARAMS: "sslmode=disable&connect_timeout=5"

  # Database username (loaded from secret)
  # This value can be used for development/testing
  # DB_USER: ""

  # Database password (loaded from secret)
  # This value can be used for development/testing
  # DB_PASS: ""

  # Database host
  # DB_HOST: "localhost"

  # PostgreSQL port
  # DB_PORT: "5432"

  # Database name
  # DB_NAME: ""

  # Signing key for JWT validation (loaded from secret)
  # Must match the key used by krateoctl to generate user tokens.
  # This value can be used for development/testing
  # SIGN_KEY: ""

  # Kubernetes namespace where {username}-clientconfig Secrets are stored.
  # Used by use.UserConfig middleware to load user credentials for RBAC.
  AUTHN_NS: "krateo-system"
